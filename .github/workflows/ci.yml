name: C++ checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        run: make -C Watopoly CXX=${{ matrix.compiler }} -j2
      - name: Run regression tests
        run: make -C tests CXX=${{ matrix.compiler }} test
