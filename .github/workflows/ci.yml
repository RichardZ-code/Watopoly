name: C++ checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive the exact source under review
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - name: Build
        run: make -C Watopoly -j2
      - name: Regression tests
        run: |
          if [ -f tests/Makefile ]; then make -C tests test; fi
      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watopoly-source
          path: source.tar.gz
          retention-days: 1
