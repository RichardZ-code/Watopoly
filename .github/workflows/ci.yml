name: C++ checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        run: make -C Watopoly -j2
      - name: Regression tests with undefined-behavior checks
        run: make -C tests test CXXFLAGS='-std=c++14 -g -Wall -Wextra -fsanitize=undefined -fno-sanitize-recover=all'
