name: Apply verified ownership patch
on:
  push:
    branches: ['fix/correctness-regressions']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'RichardZ-code/Watopoly' && github.ref == 'refs/heads/fix/correctness-regressions'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact locally tested edits without replacing unrelated code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('Watopoly/Watopoly.cc')
          actual = subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip()
          if actual != 'aeeb6568c2f2cfc8d601619716ea91750e05208a':
              raise SystemExit('Refusing to edit changed source')
          s = p.read_text()
          a = 'cur_player->addProperty(theplayers[i]->getProperty(receive));'
          b = 'theplayers[i]->addProperty(cur_player->getProperty(give));'
          assert s.count(a) == 2 and s.count(b) == 2
          s = s.replace(a, a + '\n                            theplayers[i]->getProperty(receive)->setOwner(cur_player);')
          s = s.replace(b, b + '\n                            cur_player->getProperty(give)->setOwner(theplayers[i]);')
          start = s.index('void Watopoly::unmortgagebuilding')
          end = s.index('void Watopoly::Bankrupt', start)
          piece = s[start:end]
          a = '            string owner = thebuildings[i]->getOwner()->getname();'
          assert piece.count(a) == 1
          piece = piece.replace(a, '            if (!thebuildings[i]->getOwner())\n            {\n                cout << "This building is not purchased yet" << endl;\n                return;\n            }\n' + a)
          s = s[:start] + piece + s[end:]
          p.write_bytes(s.replace('\n', '\r\n').encode())
          PY
      - name: Validate patched game
        run: |
          make -C Watopoly -j2
          make -C tests test CXXFLAGS='-std=c++14 -g -Wall -Wextra -fsanitize=undefined -fno-sanitize-recover=all'
      - name: Commit only verified source edits to the maintenance branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Watopoly/Watopoly.cc
          git commit -m 'fix: preserve traded ownership and reject unowned unmortgage'
          git push origin HEAD:refs/heads/fix/correctness-regressions
