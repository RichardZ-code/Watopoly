name: C++ checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C Watopoly -j2
      - name: Regression tests
        run: make -C tests test
      - name: Startup and quit smoke test
        run: |
          python3 - <<'PYTHON'
          import subprocess
          subprocess.run(['./Watopoly/watopoly'], input='2\nG\nS\nquit\n', text=True, check=True, timeout=10)
          PYTHON
